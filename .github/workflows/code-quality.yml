name: Code Quality

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: ClangFormat
    runs-on: ubuntu-latest
    if: true # Set to false to disable this job.
    timeout-minutes: 5
    container: ghcr.io/regentsburgess/demolib-ci:clang-19
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show formatter
        run: clang-format-19 --version
      - name: Check formatting
        run: git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.ipp' | xargs -0 --no-run-if-empty clang-format-19 --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    if: true # Set to false to disable this job.
    timeout-minutes: 10
    container: ghcr.io/regentsburgess/demolib-ci:clang-19
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show analyzer
        run: clang-tidy-19 --version
      - name: Configure and analyze
        run: cmake --workflow --preset ci-clang-tidy

  clang-coverage:
    name: Linux / Clang 19 / Debug / Coverage
    runs-on: ubuntu-latest
    if: true # Set to false to disable this job.
    timeout-minutes: 15
    container: ghcr.io/regentsburgess/demolib-ci:clang-19
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/build/ci-clang-coverage/coverage-%p.profraw
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure, build, and test
        run: cmake --workflow --preset ci-clang-coverage-test
      - name: Merge coverage profiles
        run: llvm-profdata-19 merge -sparse build/ci-clang-coverage/coverage-*.profraw -o build/ci-clang-coverage/coverage.profdata
      - name: Print coverage summary
        run: llvm-cov-19 report build/ci-clang-coverage/tests/demolib_tests -instr-profile=build/ci-clang-coverage/coverage.profdata -ignore-filename-regex='(^|/)(build|tests)/'
      - name: Generate HTML coverage report
        run: llvm-cov-19 show build/ci-clang-coverage/tests/demolib_tests -instr-profile=build/ci-clang-coverage/coverage.profdata -format=html -output-dir=build/ci-clang-coverage/coverage-html -show-line-counts-or-regions -ignore-filename-regex='(^|/)(build|tests)/'
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: clang-debug-coverage
          path: build/ci-clang-coverage/coverage-html
          if-no-files-found: error

  required-quality:
    name: Required Code Quality
    if: ${{ always() }}
    needs:
      - format
      - clang-tidy
      - clang-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every code quality job
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CLANG_TIDY_RESULT: ${{ needs.clang-tidy.result }}
          CLANG_COVERAGE_RESULT: ${{ needs.clang-coverage.result }}
        run: |
          test "$FORMAT_RESULT" = success
          test "$CLANG_TIDY_RESULT" = success
          test "$CLANG_COVERAGE_RESULT" = success
