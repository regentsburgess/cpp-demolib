name: Cross Platform Build and Test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / ${{ matrix.runner }} / ${{ matrix.workflow-preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - macos-26-intel
        workflow-preset:
          - macos-test-debug
          - macos-test-release
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          "$CXX" --version
          cmake --version
          ninja --version
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow-preset }}


  required-build:
    name: Required Build and Test
    if: ${{ always() }}
    needs:
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build and test job
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$MACOS_RESULT" = success
