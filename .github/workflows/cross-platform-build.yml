name: Cross Platform Build and Test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://github.com/actions/runner-images
jobs:
  macos-arm64:
    name: macOS ARM64 / ${{ matrix.toolchain.compiler }} / ${{ matrix.workflow-preset }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - compiler: AppleClang
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - compiler: Clang 20
            cc: /opt/homebrew/opt/llvm@20/bin/clang
            cxx: /opt/homebrew/opt/llvm@20/bin/clang++
          - compiler: GCC 15
            cc: gcc-15
            cxx: g++-15
        workflow-preset:
          - macos-test-debug
          - macos-test-release
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          "$CXX" --version
          cmake --version
          ninja --version
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow-preset }}


  required-build:
    name: Required Build and Test
    if: ${{ always() }}
    needs:
      - macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build and test job
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$MACOS_RESULT" = success
