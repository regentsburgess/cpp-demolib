# References
# 1. https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_dispatch
# 2. https://github.com/actions/runner-images

name: Cross Platform Build and Test

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Using separate arm64 and x64 jobs due to differences in Homebrew's location.
# A single job with some extra logic could be used, but this is a demo project and the 
# extra complication was deemed more complicating than useful.
jobs:
  macos-arm64:
    name: macOS ARM64 / ${{ matrix.toolchain.compiler }} / ${{ matrix.workflow-preset }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - compiler: AppleClang
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - compiler: Clang 20
            cc: /opt/homebrew/opt/llvm@20/bin/clang
            cxx: /opt/homebrew/opt/llvm@20/bin/clang++
          - compiler: GCC 15
            cc: gcc-15
            cxx: g++-15
        workflow-preset:
          - macos-test-debug
          - macos-test-release
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Symlink clang-format and clang-tidy to a PATH location
        # Homebrew's versioned LLVM is keg-only; its tools aren't exposed through /opt/homebrew/bin.
        # Expose clang-format and clang-tidy without putting the entire LLVM toolchain on the path.
        run: |
          ln -s /opt/homebrew/opt/llvm@20/bin/clang-format /opt/homebrew/bin/clang-format
          ln -s /opt/homebrew/opt/llvm@20/bin/clang-tidy /opt/homebrew/bin/clang-tidy
      - name: Inspect Environment
        run: .github/workflows/macos-env.sh
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow-preset }}
  macos-x64:
    name: macOS x64 / ${{ matrix.toolchain.compiler }} / ${{ matrix.workflow-preset }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - compiler: AppleClang
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
          - compiler: Clang 20
            cc: /usr/local/opt/llvm@20/bin/clang
            cxx: /usr/local/opt/llvm@20/bin/clang++
          - compiler: GCC 15
            cc: gcc-15
            cxx: g++-15
        workflow-preset:
          - macos-test-debug
          - macos-test-release
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Symlink clang-format and clang-tidy to a PATH location
        # Homebrew's versioned LLVM is keg-only; its tools aren't exposed through /usr/local/bin.
        # Expose clang-format and clang-tidy without putting the entire LLVM toolchain on the path.
        run: |
          ln -s /usr/local/opt/llvm@20/bin/clang-format /usr/local/bin/clang-format
          ln -s /usr/local/opt/llvm@20/bin/clang-tidy /usr/local/bin/clang-tidy
      - name: Inspect Environment
        run: .github/workflows/macos-env.sh
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow-preset }}


  required-build:
    name: Required Build and Test
    if: ${{ always() }}
    needs:
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build and test job
        env:
          ARM64_RESULT: ${{ needs.macos-arm64.result }}
          X64_RESULT: ${{ needs.macos-x64.result }}
        run: |
          test "$ARM64_RESULT" = success
          test "$X64_RESULT" = success
