stages:
  - format
  - static-analysis
  - test
  - dynamic-analysis
  - coverage

default:
  interruptible: true
  cache:
    key: cpm-googletest-v1.17.0
    paths:
      - .cache/CPM/

variables:
  CPM_SOURCE_CACHE: $CI_PROJECT_DIR/.cache/CPM
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

format:
  stage: format
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  script:
    - clang-format-19 --version
    - git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.ipp' | xargs -0 --no-run-if-empty clang-format-19 --dry-run --Werror

clang-tidy:
  stage: static-analysis
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  script:
    - clang-tidy-19 --version
    - cmake --workflow --preset ci-clang-tidy

.linux-test:
  stage: test
  script:
    - cmake --workflow --preset $CMAKE_WORKFLOW_PRESET
  artifacts:
    when: always
    reports:
      junit: $CTEST_JUNIT_FILE

linux:gcc:debug:
  extends: .linux-test
  image: ghcr.io/regentsburgess/demolib-ci:gcc-14
  variables:
    CMAKE_WORKFLOW_PRESET: ci-debug-test
    CTEST_JUNIT_FILE: build/ci-debug/ctest.xml

linux:gcc:release:
  extends: .linux-test
  image: ghcr.io/regentsburgess/demolib-ci:gcc-14
  variables:
    CMAKE_WORKFLOW_PRESET: ci-release-test
    CTEST_JUNIT_FILE: build/ci-release/ctest.xml

linux:clang:debug:
  extends: .linux-test
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  variables:
    CMAKE_WORKFLOW_PRESET: ci-debug-test
    CTEST_JUNIT_FILE: build/ci-debug/ctest.xml

linux:clang:release:
  extends: .linux-test
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  variables:
    CMAKE_WORKFLOW_PRESET: ci-release-test
    CTEST_JUNIT_FILE: build/ci-release/ctest.xml

clang:sanitizers:
  stage: dynamic-analysis
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  variables:
    ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    LLVM_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-19
  script:
    - cmake --workflow --preset ci-clang-sanitizers-test
  artifacts:
    when: always
    reports:
      junit: build/ci-clang-sanitizers/ctest.xml

clang:coverage:
  stage: coverage
  image: ghcr.io/regentsburgess/demolib-ci:clang-19
  variables:
    LLVM_PROFILE_FILE: $CI_PROJECT_DIR/build/ci-clang-coverage/coverage-%p.profraw
  script:
    - cmake --workflow --preset ci-clang-coverage-test
    - llvm-profdata-19 merge -sparse build/ci-clang-coverage/coverage-*.profraw -o build/ci-clang-coverage/coverage.profdata
    - llvm-cov-19 report build/ci-clang-coverage/tests/demolib_tests -instr-profile=build/ci-clang-coverage/coverage.profdata -ignore-filename-regex='(^|/)(build|tests)/'
    - llvm-cov-19 show build/ci-clang-coverage/tests/demolib_tests -instr-profile=build/ci-clang-coverage/coverage.profdata -format=html -output-dir=build/ci-clang-coverage/coverage-html -show-line-counts-or-regions -ignore-filename-regex='(^|/)(build|tests)/'
  artifacts:
    when: always
    paths:
      - build/ci-clang-coverage/coverage-html/
    reports:
      junit: build/ci-clang-coverage/ctest.xml
